<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModHub - Platform Modding App</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --bg2: #12121a;
            --bg3: #1a1a28;
            --bg4: #222233;
            --accent: #a855f7;
            --accent2: #7c3aed;
            --accent-glow: rgba(168, 85, 247, 0.3);
            --gold: #f59e0b;
            --green: #10b981;
            --red: #ef4444;
            --blue: #3b82f6;
            --text: #e2e8f0;
            --text2: #a1a1aa;
            --text3: #71717a;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 8px;
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.3);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Background effects */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(168, 85, 247, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(59, 130, 246, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(16, 185, 129, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: bgShift 20s ease-in-out infinite;
        }
        @keyframes bgShift {
            0%,
            100% {
                transform: translate(0, 0);
            }
            33% {
                transform: translate(1%, -1%);
            }
            66% {
                transform: translate(-1%, 1%);
            }
        }

        /* Grid pattern overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
        }

        /* Container */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        /* HEADER */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 16px 0;
            transition: var(--transition);
        }
        .header.scrolled {
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }
        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
            text-decoration: none;
            white-space: nowrap;
        }
        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: var(--radius-xs);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 0 30px var(--accent-glow);
            animation: pulse-glow 3s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%,
            100% {
                box-shadow: 0 0 20px var(--accent-glow);
            }
            50% {
                box-shadow: 0 0 40px var(--accent-glow), 0 0 60px rgba(168, 85, 247, 0.2);
            }
        }
        .logo-text span {
            background: linear-gradient(135deg, #c084fc, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Search */
        .search-wrap {
            position: relative;
            flex: 1;
            max-width: 400px;
            min-width: 200px;
        }
        .search-input {
            width: 100%;
            padding: 12px 18px 12px 46px;
            border-radius: 50px;
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            background: var(--bg3);
            color: var(--text);
            font-size: 0.95rem;
            transition: var(--transition);
            outline: none;
            font-family: var(--font);
        }
        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.1);
            background: var(--bg4);
        }
        .search-input::placeholder {
            color: var(--text3);
        }
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text3);
            pointer-events: none;
            font-size: 1.1rem;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
            text-decoration: none;
            font-family: var(--font);
            white-space: nowrap;
            letter-spacing: 0.2px;
            position: relative;
            overflow: hidden;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.5);
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            color: var(--text);
        }
        .btn-outline:hover {
            border-color: var(--accent);
            background: rgba(168, 85, 247, 0.08);
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: 0.8rem;
            border-radius: 30px;
        }
        .btn-icon {
            width: 38px;
            height: 38px;
            padding: 0;
            border-radius: 50%;
            justify-content: center;
            font-size: 1.1rem;
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: var(--red);
        }

        /* STATS BAR */
        .stats-bar {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin: 24px 0;
            position: relative;
            z-index: 1;
        }
        .stat-card {
            flex: 1;
            min-width: 140px;
            background: var(--bg2);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-sm);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: var(--transition);
        }
        .stat-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: var(--shadow-card);
        }
        .stat-icon {
            width: 46px;
            height: 46px;
            border-radius: var(--radius-xs);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }
        .stat-icon.purple {
            background: rgba(168, 85, 247, 0.2);
            color: #c084fc;
        }
        .stat-icon.blue {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }
        .stat-icon.green {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }
        .stat-icon.gold {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }
        .stat-info .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
        }
        .stat-info .stat-label {
            font-size: 0.78rem;
            color: var(--text3);
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        /* FILTER CHIPS */
        .filter-section {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }
        .filter-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text3);
            margin-right: 4px;
        }
        .chip {
            padding: 8px 16px;
            border-radius: 50px;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            background: transparent;
            color: var(--text2);
            cursor: pointer;
            font-size: 0.82rem;
            transition: var(--transition);
            font-family: var(--font);
            font-weight: 500;
            white-space: nowrap;
        }
        .chip:hover {
            border-color: rgba(255, 255, 255, 0.3);
            color: #fff;
        }
        .chip.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* POST GRID */
        .post-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            position: relative;
            z-index: 1;
            margin-bottom: 40px;
        }
        .post-card {
            background: var(--bg2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius);
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .post-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(168, 85, 247, 0.1);
        }
        .post-card:active {
            transform: scale(0.98);
        }
        .card-banner {
            height: 160px;
            background: linear-gradient(135deg, var(--bg3) 0%, var(--bg4) 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }
        .card-banner .banner-icon {
            font-size: 5rem;
            opacity: 0.7;
            filter: grayscale(30%);
            transition: var(--transition);
        }
        .post-card:hover .card-banner .banner-icon {
            transform: scale(1.1);
            filter: grayscale(0%);
            opacity: 1;
        }
        .card-banner .index-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            color: #fff;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 6px 12px;
            border-radius: 50px;
            letter-spacing: 0.5px;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .card-banner .category-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            font-size: 0.7rem;
            padding: 6px 12px;
            border-radius: 50px;
            letter-spacing: 0.5px;
            z-index: 2;
            text-transform: uppercase;
        }
        .card-body {
            padding: 18px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.3px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-desc {
            font-size: 0.85rem;
            color: var(--text2);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }
        .card-meta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 0.78rem;
            color: var(--text3);
            margin-top: auto;
            padding-top: 8px;
        }
        .card-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .card-footer {
            display: flex;
            gap: 8px;
            padding: 0 20px 18px;
            flex-wrap: wrap;
        }
        .tag {
            font-size: 0.7rem;
            padding: 5px 10px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            letter-spacing: 0.3px;
        }
        .version-tag {
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            border-color: rgba(59, 130, 246, 0.3);
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            position: relative;
            z-index: 1;
            grid-column: 1 / -1;
        }
        .empty-state .empty-icon {
            font-size: 5rem;
            margin-bottom: 16px;
            opacity: 0.4;
        }
        .empty-state h3 {
            color: #fff;
            font-size: 1.3rem;
            margin-bottom: 8px;
        }
        .empty-state p {
            color: var(--text3);
            max-width: 400px;
            margin: 0 auto 20px;
        }

        /* MODAL OVERLAY */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .modal {
            background: var(--bg2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius);
            width: 100%;
            max-width: 650px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            position: relative;
            transform: translateY(20px) scale(0.96);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active .modal {
            transform: translateY(0) scale(1);
        }
        .modal-header {
            position: sticky;
            top: 0;
            background: var(--bg2);
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            border-radius: var(--radius) var(--radius) 0 0;
        }
        .modal-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.3px;
        }
        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            cursor: pointer;
            font-size: 1.2rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: rotate(90deg);
        }
        .modal-body {
            padding: 24px;
        }
        .modal-body .detail-banner {
            width: 100%;
            height: 200px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--bg3), var(--bg4));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.05);
        }
        .detail-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .detail-meta-item {
            background: var(--bg3);
            padding: 14px;
            border-radius: var(--radius-xs);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .detail-meta-item .meta-val {
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
        }
        .detail-meta-item .meta-lbl {
            font-size: 0.7rem;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .detail-desc {
            color: var(--text2);
            line-height: 1.7;
            margin-bottom: 16px;
        }
        .detail-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        /* FORM */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text);
            margin-bottom: 6px;
            letter-spacing: 0.2px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-xs);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            background: var(--bg3);
            color: var(--text);
            font-size: 0.9rem;
            font-family: var(--font);
            transition: var(--transition);
            outline: none;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.1);
            background: var(--bg4);
        }
        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .form-row .form-group {
            flex: 1;
            min-width: 140px;
            margin-bottom: 18px;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        /* TOAST */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            padding: 14px 20px;
            border-radius: var(--radius-xs);
            background: var(--bg4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-weight: 500;
            font-size: 0.9rem;
            box-shadow: var(--shadow-lg);
            animation: slideInRight 0.4s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 400px;
        }
        .toast.success {
            border-left: 4px solid var(--green);
        }
        .toast.error {
            border-left: 4px solid var(--red);
        }
        @keyframes slideInRight {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .post-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .header-inner {
                gap: 12px;
            }
            .search-wrap {
                order: 3;
                max-width: 100%;
                flex: 100%;
            }
            .stats-bar {
                gap: 10px;
            }
            .stat-card {
                padding: 14px;
                gap: 10px;
            }
            .stat-info .stat-value {
                font-size: 1.2rem;
            }
            .modal {
                max-width: 95vw;
                max-height: 90vh;
            }
            .card-banner {
                height: 130px;
            }
        }
        @media (max-width: 480px) {
            .container {
                padding: 0 12px;
            }
            .btn {
                padding: 10px 16px;
                font-size: 0.8rem;
            }
            .logo {
                font-size: 1.2rem;
            }
            .logo-icon {
                width: 34px;
                height: 34px;
                font-size: 1.1rem;
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header" id="header">
        <div class="container">
            <div class="header-inner">
                <a href="#" class="logo" onclick="resetFilters()">
                    <div class="logo-icon">⚡</div>
                    <div class="logo-text"><span>Mod</span>Hub</div>
                </a>
                <div class="search-wrap">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="searchInput" placeholder="Cari mod... (nama, deskripsi, tag)" oninput="renderPosts()">
                </div>
                <button class="btn btn-primary" onclick="openCreateModal()">
                    <span>＋</span> Tambah Mod
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="container">
        <!-- Stats -->
        <div class="stats-bar" id="statsBar">
            <div class="stat-card">
                <div class="stat-icon purple">📦</div>
                <div class="stat-info">
                    <div class="stat-value" id="statTotal">0</div>
                    <div class="stat-label">Total Mod</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon blue">⬇️</div>
                <div class="stat-info">
                    <div class="stat-value" id="statDownloads">0</div>
                    <div class="stat-label">Total Download</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">⭐</div>
                <div class="stat-info">
                    <div class="stat-value" id="statAvgRating">0</div>
                    <div class="stat-label">Rata-rata Rating</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon gold">🏷️</div>
                <div class="stat-info">
                    <div class="stat-value" id="statCategories">0</div>
                    <div class="stat-label">Kategori</div>
                </div>
            </div>
        </div>

        <!-- Filter -->
        <div class="filter-section">
            <span class="filter-label">Filter:</span>
            <button class="chip active" data-category="all" onclick="setCategory('all', this)">🌟 Semua</button>
            <button class="chip" data-category="game" onclick="setCategory('game', this)">🎮 Game</button>
            <button class="chip" data-category="tool" onclick="setCategory('tool', this)">🔧 Tools</button>
            <button class="chip" data-category="social" onclick="setCategory('social', this)">💬 Sosial</button>
            <button class="chip" data-category="multimedia" onclick="setCategory('multimedia', this)">🎬 Multimedia</button>
            <button class="chip" data-category="productivity" onclick="setCategory('productivity', this)">📋 Produktivitas</button>
            <button class="chip" data-category="other" onclick="setCategory('other', this)">📎 Lainnya</button>
        </div>

        <!-- Post Grid -->
        <div class="post-grid" id="postGrid">
            <!-- Rendered dynamically -->
        </div>
    </main>

    <!-- DETAIL MODAL -->
    <div class="modal-overlay" id="detailModalOverlay">
        <div class="modal" id="detailModal">
            <div class="modal-header">
                <h2 id="detailModalTitle">Detail Mod</h2>
                <button class="modal-close" onclick="closeDetailModal()">✕</button>
            </div>
            <div class="modal-body" id="detailModalBody">
                <!-- Filled dynamically -->
            </div>
        </div>
    </div>

    <!-- FORM MODAL (Create/Edit) -->
    <div class="modal-overlay" id="formModalOverlay">
        <div class="modal" id="formModal">
            <div class="modal-header">
                <h2 id="formModalTitle">Tambah Mod Baru</h2>
                <button class="modal-close" onclick="closeFormModal()">✕</button>
            </div>
            <div class="modal-body">
                <form id="modForm" onsubmit="handleFormSubmit(event)">
                    <input type="hidden" id="formEditId" value="">
                    <div class="form-group">
                        <label>📱 Nama Aplikasi / Mod *</label>
                        <input type="text" id="formName" placeholder="Contoh: WhatsApp Premium Mod" required maxlength="80">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>🏷️ Kategori *</label>
                            <select id="formCategory" required>
                                <option value="">Pilih kategori...</option>
                                <option value="game">🎮 Game</option>
                                <option value="tool">🔧 Tools</option>
                                <option value="social">💬 Sosial</option>
                                <option value="multimedia">🎬 Multimedia</option>
                                <option value="productivity">📋 Produktivitas</option>
                                <option value="other">📎 Lainnya</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>🔢 Versi *</label>
                            <input type="text" id="formVersion" placeholder="v1.0.0" required maxlength="20">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>👨‍💻 Developer</label>
                            <input type="text" id="formDeveloper" placeholder="Nama developer" maxlength="60">
                        </div>
                        <div class="form-group">
                            <label>⭐ Rating (0-5)</label>
                            <input type="number" id="formRating" placeholder="4.5" min="0" max="5" step="0.1" value="4.5">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>📝 Deskripsi Singkat *</label>
                        <textarea id="formDescription" rows="2" placeholder="Deskripsi singkat mod..." required maxlength="200"></textarea>
                    </div>
                    <div class="form-group">
                        <label>📄 Deskripsi Lengkap</label>
                        <textarea id="formFullDescription" rows="4" placeholder="Fitur lengkap, changelog, cara install..." maxlength="2000"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>🔗 Link Download</label>
                            <input type="url" id="formDownloadLink" placeholder="https://...">
                        </div>
                        <div class="form-group">
                            <label>⬇️ Jumlah Download</label>
                            <input type="number" id="formDownloadCount" placeholder="0" min="0" value="0">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>🏷️ Tags (pisahkan dengan koma)</label>
                        <input type="text" id="formTags" placeholder="premium, unlocked, no-ads" maxlength="150">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-outline" onclick="closeFormModal()">Batal</button>
                        <button type="submit" class="btn btn-primary" id="formSubmitBtn">💾 Simpan Mod</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (() => {
            // ============ DATA STORE ============
            const STORAGE_KEY = 'modhub_posts';
            let posts = [];
            let currentCategory = 'all';
            let editingId = null;

            // Load from localStorage
            function loadPosts() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    posts = raw ? JSON.parse(raw) : [];
                } catch (e) {
                    posts = [];
                }
                // Ensure all posts have required fields
                posts = posts.map((p, i) => ({
                    id: p.id || generateId(),
                    index: i + 1, // will be recalculated
                    name: p.name || 'Untitled',
                    category: p.category || 'other',
                    version: p.version || 'v1.0',
                    developer: p.developer || 'Unknown',
                    rating: parseFloat(p.rating) || 0,
                    description: p.description || '',
                    fullDescription: p.fullDescription || '',
                    downloadLink: p.downloadLink || '',
                    downloadCount: parseInt(p.downloadCount) || 0,
                    tags: Array.isArray(p.tags) ? p.tags : (p.tags ? p.tags.split(',').map(t => t.trim()).filter(Boolean) :
                        []),
                    createdAt: p.createdAt || new Date().toISOString(),
                    updatedAt: p.updatedAt || new Date().toISOString(),
                }));
                recalculateIndices();
                savePosts();
            }

            function generateId() {
                return 'mod_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }

            function recalculateIndices() {
                posts.forEach((p, i) => {
                    p.index = i + 1;
                });
            }

            function savePosts() {
                recalculateIndices();
                localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
            }

            function addPost(data) {
                const now = new Date().toISOString();
                const newPost = {
                    id: generateId(),
                    index: posts.length + 1,
                    name: data.name,
                    category: data.category,
                    version: data.version,
                    developer: data.developer || 'Unknown',
                    rating: parseFloat(data.rating) || 0,
                    description: data.description || '',
                    fullDescription: data.fullDescription || '',
                    downloadLink: data.downloadLink || '',
                    downloadCount: parseInt(data.downloadCount) || 0,
                    tags: data.tags || [],
                    createdAt: now,
                    updatedAt: now,
                };
                posts.unshift(newPost); // newest first
                savePosts();
                return newPost;
            }

            function updatePost(id, data) {
                const idx = posts.findIndex(p => p.id === id);
                if (idx === -1) return null;
                posts[idx] = {
                    ...posts[idx],
                    name: data.name,
                    category: data.category,
                    version: data.version,
                    developer: data.developer || 'Unknown',
                    rating: parseFloat(data.rating) || 0,
                    description: data.description || '',
                    fullDescription: data.fullDescription || '',
                    downloadLink: data.downloadLink || '',
                    downloadCount: parseInt(data.downloadCount) || 0,
                    tags: data.tags || [],
                    updatedAt: new Date().toISOString(),
                };
                savePosts();
                return posts[idx];
            }

            function deletePost(id) {
                posts = posts.filter(p => p.id !== id);
                savePosts();
            }

            function getFilteredPosts() {
                let filtered = [...posts];
                // Category filter
                if (currentCategory !== 'all') {
                    filtered = filtered.filter(p => p.category === currentCategory);
                }
                // Search filter
                const query = document.getElementById('searchInput')?.value.trim().toLowerCase() || '';
                if (query) {
                    filtered = filtered.filter(p => {
                        const searchStr = [
                            p.name,
                            p.description,
                            p.fullDescription,
                            p.developer,
                            p.version,
                            ...p.tags,
                        ].join(' ').toLowerCase();
                        return searchStr.includes(query);
                    });
                }
                return filtered;
            }

            function getStats() {
                const filtered = getFilteredPosts();
                const allPosts = posts;
                const totalDownloads = allPosts.reduce((sum, p) => sum + p.downloadCount, 0);
                const avgRating = allPosts.length > 0 ?
                    (allPosts.reduce((sum, p) => sum + p.rating, 0) / allPosts.length).toFixed(1) :
                    0;
                const categories = new Set(allPosts.map(p => p.category));
                return {
                    total: allPosts.length,
                    totalDownloads,
                    avgRating,
                    categoriesCount: categories.size,
                    filteredCount: filtered.length,
                };
            }

            // ============ RENDER ============
            function renderPosts() {
                const grid = document.getElementById('postGrid');
                const filtered = getFilteredPosts();

                if (filtered.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <h3>Belum ada mod ditemukan</h3>
                            <p>${posts.length === 0 ? 'Klik tombol "Tambah Mod" untuk membuat postingan pertama!' : 'Coba ubah filter atau kata kunci pencarian.'}</p>
                            ${posts.length === 0 ? '<button class="btn btn-primary" onclick="openCreateModal()">＋ Tambah Mod Pertama</button>' : ''}
                        </div>`;
                } else {
                    grid.innerHTML = filtered.map(p => {
                        const bannerEmoji = getCategoryEmoji(p.category);
                        const tagsHtml = p.tags.slice(0, 3).map(t =>
                            `<span class="tag">#${escapeHTML(t)}</span>`
                        ).join('');
                        const versionHtml = p.version ?
                            `<span class="tag version-tag">${escapeHTML(p.version)}</span>` : '';
                        return `
                        <div class="post-card" onclick="openDetailModal('${p.id}')" title="Klik untuk lihat detail">
                            <div class="card-banner">
                                <span class="banner-icon">${bannerEmoji}</span>
                                <span class="index-badge">#${String(p.index).padStart(3, '0')}</span>
                                <span class="category-badge">${getCategoryLabel(p.category)}</span>
                            </div>
                            <div class="card-body">
                                <h3 class="card-title">${escapeHTML(p.name)}</h3>
                                <p class="card-desc">${escapeHTML(p.description || 'Tidak ada deskripsi.')}</p>
                                <div class="card-meta">
                                    <span>⭐ ${p.rating.toFixed(1)}</span>
                                    <span>👤 ${escapeHTML(p.developer)}</span>
                                    <span>⬇️ ${formatNumber(p.downloadCount)}</span>
                                </div>
                            </div>
                            <div class="card-footer">
                                ${versionHtml}
                                ${tagsHtml}
                            </div>
                        </div>`;
                    }).join('');
                }

                updateStats();
            }

            function updateStats() {
                const stats = getStats();
                document.getElementById('statTotal').textContent = stats.total;
                document.getElementById('statDownloads').textContent = formatNumber(stats.totalDownloads);
                document.getElementById('statAvgRating').textContent = stats.avgRating;
                document.getElementById('statCategories').textContent = stats.categoriesCount;
            }

            function getCategoryEmoji(cat) {
                const map = {
                    game: '🎮',
                    tool: '🔧',
                    social: '💬',
                    multimedia: '🎬',
                    productivity: '📋',
                    other: '📎'
                };
                return map[cat] || '📦';
            }

            function getCategoryLabel(cat) {
                const map = {
                    game: 'Game',
                    tool: 'Tools',
                    social: 'Sosial',
                    multimedia: 'Multimedia',
                    productivity: 'Produktivitas',
                    other: 'Lainnya'
                };
                return map[cat] || 'Lainnya';
            }

            function formatNumber(num) {
                if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
                if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
                return num.toString();
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ============ MODALS ============
            function openDetailModal(id) {
                const post = posts.find(p => p.id === id);
                if (!post) return;
                const overlay = document.getElementById('detailModalOverlay');
                document.getElementById('detailModalTitle').textContent = `#${String(post.index).padStart(3, '0')} - ${post.name}`;
                document.getElementById('detailModalBody').innerHTML = `
                    <div class="detail-banner">${getCategoryEmoji(post.category)}</div>
                    <div class="detail-meta-grid">
                        <div class="detail-meta-item"><div class="meta-val">⭐ ${post.rating.toFixed(1)}</div><div class="meta-lbl">Rating</div></div>
                        <div class="detail-meta-item"><div class="meta-val">${escapeHTML(post.version)}</div><div class="meta-lbl">Versi</div></div>
                        <div class="detail-meta-item"><div class="meta-val">👤 ${escapeHTML(post.developer)}</div><div class="meta-lbl">Developer</div></div>
                        <div class="detail-meta-item"><div class="meta-val">⬇️ ${formatNumber(post.downloadCount)}</div><div class="meta-lbl">Download</div></div>
                        <div class="detail-meta-item"><div class="meta-val">${getCategoryLabel(post.category)}</div><div class="meta-lbl">Kategori</div></div>
                        <div class="detail-meta-item"><div class="meta-val">#${String(post.index).padStart(3, '0')}</div><div class="meta-lbl">Indeks</div></div>
                    </div>
                    <p class="detail-desc"><strong>Deskripsi:</strong><br>${escapeHTML(post.fullDescription || post.description || 'Tidak ada deskripsi lengkap.')}</p>
                    ${post.tags.length > 0 ? `<div class="detail-tags">${post.tags.map(t => `<span class="tag">#${escapeHTML(t)}</span>`).join('')}</div>` : ''}
                    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;">
                        ${post.downloadLink ? `<a href="${escapeHTML(post.downloadLink)}" target="_blank" rel="noopener" class="btn btn-primary" onclick="incrementDownload('${post.id}')">⬇️ Download Mod</a>` : '<span class="btn btn-outline" style="opacity:0.5;pointer-events:none;">🔗 Link tidak tersedia</span>'}
                        <button class="btn btn-outline" onclick="closeDetailModal(); openEditModal('${post.id}')">✏️ Edit</button>
                        <button class="btn btn-danger" onclick="if(confirm('Yakin hapus mod ini?')){deletePost('${post.id}');closeDetailModal();renderPosts();showToast('Mod berhasil dihapus','error');}">🗑️ Hapus</button>
                    </div>
                    <p style="font-size:0.7rem;color:var(--text3);margin-top:12px;">Dibuat: ${new Date(post.createdAt).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})} | Diperbarui: ${new Date(post.updatedAt).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</p>
                `;
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeDetailModal() {
                document.getElementById('detailModalOverlay').classList.remove('active');
                document.body.style.overflow = '';
            }

            function openCreateModal() {
                editingId = null;
                document.getElementById('formModalTitle').textContent = 'Tambah Mod Baru';
                document.getElementById('formSubmitBtn').textContent = '💾 Simpan Mod';
                document.getElementById('modForm').reset();
                document.getElementById('formEditId').value = '';
                document.getElementById('formRating').value = '4.5';
                document.getElementById('formDownloadCount').value = '0';
                document.getElementById('formModalOverlay').classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function openEditModal(id) {
                const post = posts.find(p => p.id === id);
                if (!post) return;
                editingId = id;
                document.getElementById('formModalTitle').textContent = 'Edit Mod';
                document.getElementById('formSubmitBtn').textContent = '💾 Update Mod';
                document.getElementById('formEditId').value = id;
                document.getElementById('formName').value = post.name;
                document.getElementById('formCategory').value = post.category;
                document.getElementById('formVersion').value = post.version;
                document.getElementById('formDeveloper').value = post.developer;
                document.getElementById('formRating').value = post.rating;
                document.getElementById('formDescription').value = post.description;
                document.getElementById('formFullDescription').value = post.fullDescription || '';
                document.getElementById('formDownloadLink').value = post.downloadLink;
                document.getElementById('formDownloadCount').value = post.downloadCount;
                document.getElementById('formTags').value = post.tags.join(', ');
                document.getElementById('formModalOverlay').classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeFormModal() {
                document.getElementById('formModalOverlay').classList.remove('active');
                document.body.style.overflow = '';
                editingId = null;
            }

            function handleFormSubmit(e) {
                e.preventDefault();
                const data = {
                    name: document.getElementById('formName').value.trim(),
                    category: document.getElementById('formCategory').value,
                    version: document.getElementById('formVersion').value.trim(),
                    developer: document.getElementById('formDeveloper').value.trim(),
                    rating: parseFloat(document.getElementById('formRating').value) || 0,
                    description: document.getElementById('formDescription').value.trim(),
                    fullDescription: document.getElementById('formFullDescription').value.trim(),
                    downloadLink: document.getElementById('formDownloadLink').value.trim(),
                    downloadCount: parseInt(document.getElementById('formDownloadCount').value) || 0,
                    tags: document.getElementById('formTags').value.split(',').map(t => t.trim()).filter(Boolean),
                };
                if (!data.name || !data.category) {
                    showToast('Nama dan kategori wajib diisi!', 'error');
                    return;
                }
                if (data.rating < 0 || data.rating > 5) {
                    showToast('Rating harus antara 0 - 5', 'error');
                    return;
                }

                const editId = document.getElementById('formEditId').value;
                if (editId) {
                    updatePost(editId, data);
                    showToast('✅ Mod berhasil diperbarui!', 'success');
                } else {
                    addPost(data);
                    showToast('🎉 Mod baru berhasil ditambahkan!', 'success');
                }
                closeFormModal();
                renderPosts();
            }

            function incrementDownload(id) {
                const post = posts.find(p => p.id === id);
                if (post) {
                    post.downloadCount += 1;
                    post.updatedAt = new Date().toISOString();
                    savePosts();
                    renderPosts();
                }
            }

            // ============ FILTER ============
            function setCategory(cat, btnEl) {
                currentCategory = cat;
                document.querySelectorAll('.filter-section .chip').forEach(c => c.classList.remove('active'));
                if (btnEl) btnEl.classList.add('active');
                renderPosts();
            }

            function resetFilters() {
                currentCategory = 'all';
                document.getElementById('searchInput').value = '';
                document.querySelectorAll('.filter-section .chip').forEach(c => c.classList.remove('active'));
                const allChip = document.querySelector('.filter-section .chip[data-category="all"]');
                if (allChip) allChip.classList.add('active');
                renderPosts();
            }

            // ============ TOAST ============
            function showToast(message, type = 'success') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.animation = 'fadeOut 0.4s ease forwards';
                    setTimeout(() => toast.remove(), 400);
                }, 2800);
            }

            // ============ OVERLAY CLICK ============
            document.getElementById('detailModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) closeDetailModal();
            });
            document.getElementById('formModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) closeFormModal();
            });

            // ============ KEYBOARD ============
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeDetailModal();
                    closeFormModal();
                }
            });

            // ============ HEADER SCROLL EFFECT ============
            window.addEventListener('scroll', () => {
                const header = document.getElementById('header');
                if (window.scrollY > 20) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });

            // ============ INIT ============
            function init() {
                loadPosts();
                renderPosts();
                // Set initial active chip
                const allChip = document.querySelector('.filter-section .chip[data-category="all"]');
                if (allChip) allChip.classList.add('active');
                console.log('🚀 ModHub siap! Total mod:', posts.length);
                console.log('📋 Fitur: Auto-index, CRUD, Search, Filter, Detail Modal, LocalStorage');
            }

            // Expose functions to global scope for onclick handlers
            window.openDetailModal = openDetailModal;
            window.closeDetailModal = closeDetailModal;
            window.openCreateModal = openCreateModal;
            window.openEditModal = openEditModal;
            window.closeFormModal = closeFormModal;
            window.handleFormSubmit = handleFormSubmit;
            window.setCategory = setCategory;
            window.resetFilters = resetFilters;
            window.renderPosts = renderPosts;
            window.deletePost = deletePost;
            window.incrementDownload = incrementDownload;
            window.showToast = showToast;

            init();
        })();
    </script>
</body>
</html>
