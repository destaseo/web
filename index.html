<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destaseo Mods - Katalog Aplikasi Mod</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --bg2: #12121a;
            --bg3: #1a1a28;
            --bg4: #222233;
            --accent: #a855f7;
            --accent2: #7c3aed;
            --accent-glow: rgba(168, 85, 247, 0.3);
            --text: #e2e8f0;
            --text2: #a1a1aa;
            --text3: #71717a;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 8px;
            --transition: 0.3s ease;
            --font: 'Segoe UI', system-ui, sans-serif;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;overflow-x:hidden;display:flex;flex-direction:column;}
        body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 30% 20%, rgba(168,85,247,0.04) 0%, transparent 50%), radial-gradient(ellipse at 70% 60%, rgba(59,130,246,0.04) 0%, transparent 50%);pointer-events:none;z-index:0;animation:bgShift 20s infinite;}
        @keyframes bgShift{0%,100%{transform:translate(0,0)}33%{transform:translate(1%,-1%)}66%{transform:translate(-1%,1%)}}
        body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0;mask-image:radial-gradient(ellipse at center, black 30%, transparent 70%);}
        .container{max-width:1300px;margin:0 auto;padding:0 24px;position:relative;z-index:1;flex:1;}
        .header{position:sticky;top:0;z-index:100;background:rgba(10,10,15,0.75);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);padding:16px 0;}
        .header.scrolled{box-shadow:0 4px 30px rgba(0,0,0,0.5);border-bottom-color:rgba(255,255,255,0.1);}
        .header-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
        .logo{display:flex;align-items:center;gap:10px;font-size:1.5rem;font-weight:800;color:#fff;text-decoration:none;white-space:nowrap;}
        .logo-icon{width:42px;height:42px;background:linear-gradient(135deg, var(--accent), var(--accent2));border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;font-size:1.4rem;box-shadow:0 0 30px var(--accent-glow);animation:pulse-glow 3s infinite;}
        @keyframes pulse-glow{0%,100%{box-shadow:0 0 20px var(--accent-glow)}50%{box-shadow:0 0 40px var(--accent-glow), 0 0 60px rgba(168,85,247,0.2)}}
        .logo-text span{background:linear-gradient(135deg, #c084fc, #a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
        .search-wrap{position:relative;flex:1;max-width:400px;min-width:200px;}
        .search-input{width:100%;padding:12px 18px 12px 46px;border-radius:50px;border:1.5px solid rgba(255,255,255,0.1);background:var(--bg3);color:var(--text);font-size:0.95rem;transition:var(--transition);outline:none;font-family:var(--font);}
        .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(168,85,247,0.1);background:var(--bg4);}
        .search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;font-size:1.1rem;}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:50px;border:none;cursor:pointer;font-weight:600;font-size:0.9rem;transition:var(--transition);text-decoration:none;font-family:var(--font);}
        .btn-primary{background:linear-gradient(135deg, var(--accent), var(--accent2));color:#fff;box-shadow:0 4px 20px rgba(168,85,247,0.35);}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(168,85,247,0.5);}
        .btn-outline{background:transparent;border:1.5px solid rgba(255,255,255,0.25);color:var(--text);}
        .btn-outline:hover{border-color:var(--accent);background:rgba(168,85,247,0.08);}
        .btn-sm{padding:6px 14px;font-size:0.8rem;}
        .btn-icon{width:38px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:1.1rem;}
        .stats-bar{display:flex;gap:16px;flex-wrap:wrap;margin:24px 0;position:relative;z-index:1;}
        .stat-card{flex:1;min-width:140px;background:var(--bg2);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius-sm);padding:18px 20px;display:flex;align-items:center;gap:14px;transition:var(--transition);}
        .stat-card:hover{border-color:rgba(255,255,255,0.15);transform:translateY(-2px);box-shadow:0 4px 24px rgba(0,0,0,0.3);}
        .stat-icon{width:46px;height:46px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;font-size:1.3rem;}
        .stat-icon.purple{background:rgba(168,85,247,0.2);color:#c084fc;}
        .stat-icon.blue{background:rgba(59,130,246,0.2);color:#60a5fa;}
        .stat-icon.green{background:rgba(16,185,129,0.2);color:#34d399;}
        .stat-icon.gold{background:rgba(245,158,11,0.2);color:#fbbf24;}
        .stat-info .stat-value{font-size:1.6rem;font-weight:700;color:#fff;}
        .stat-info .stat-label{font-size:0.78rem;color:var(--text3);text-transform:uppercase;}
        .filter-section{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px;position:relative;z-index:1;}
        .filter-label{font-size:0.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-right:4px;}
        .chip{padding:8px 16px;border-radius:50px;border:1.5px solid rgba(255,255,255,0.12);background:transparent;color:var(--text2);cursor:pointer;font-size:0.82rem;transition:var(--transition);font-family:var(--font);font-weight:500;}
        .chip:hover{border-color:rgba(255,255,255,0.3);color:#fff;}
        .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 20px var(--accent-glow);}
        .post-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(340px, 1fr));gap:20px;position:relative;z-index:1;margin-bottom:40px;}
        .post-card{background:var(--bg2);border:1px solid rgba(255,255,255,0.05);border-radius:var(--radius);overflow:hidden;transition:var(--transition);cursor:pointer;display:flex;flex-direction:column;}
        .post-card:hover{border-color:rgba(255,255,255,0.15);transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,0.4);}
        .card-banner{height:180px;background:linear-gradient(135deg, var(--bg3), var(--bg4));position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:4rem;color:rgba(255,255,255,0.06);background-size:cover;background-position:center;transition:var(--transition);}
        .post-card:hover .card-banner{transform:scale(1.02);}
        .card-banner .banner-icon{font-size:5rem;opacity:0.7;transition:var(--transition);}
        .post-card:hover .card-banner .banner-icon{transform:scale(1.1);opacity:1;}
        .index-badge{position:absolute;top:14px;left:14px;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);color:#fff;font-weight:700;font-size:0.75rem;padding:6px 12px;border-radius:50px;z-index:2;}
        .category-badge{position:absolute;top:14px;right:14px;background:var(--accent);color:#fff;font-weight:600;font-size:0.7rem;padding:6px 12px;border-radius:50px;z-index:2;text-transform:uppercase;}
        .card-body{padding:18px 20px;flex:1;display:flex;flex-direction:column;gap:8px;}
        .card-title{font-size:1.15rem;font-weight:700;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
        .card-desc{font-size:0.85rem;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
        .card-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:0.78rem;color:var(--text3);margin-top:auto;padding-top:8px;}
        .clickable-dev{cursor:pointer;color:var(--accent);font-weight:500;transition:var(--transition);}
        .clickable-dev:hover{color:#c084fc;text-decoration:underline;}
        .card-footer{display:flex;gap:8px;padding:0 20px 18px;flex-wrap:wrap;}
        .tag{font-size:0.7rem;padding:5px 10px;border-radius:50px;background:rgba(255,255,255,0.04);color:var(--text3);border:1px solid rgba(255,255,255,0.08);cursor:pointer;transition:var(--transition);}
        .tag:hover{background:rgba(255,255,255,0.1);color:#fff;}
        .version-tag{background:rgba(59,130,246,0.15);color:#93c5fd;}
        .empty-state{text-align:center;padding:60px 20px;grid-column:1/-1;}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity 0.3s;}
        .modal-overlay.active{opacity:1;pointer-events:all;}
        .modal{background:var(--bg2);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius);width:100%;max-width:750px;max-height:85vh;overflow-y:auto;box-shadow:0 25px 50px rgba(0,0,0,0.5);transform:translateY(20px) scale(0.96);transition:transform 0.35s;}
        .modal-overlay.active .modal{transform:translateY(0) scale(1);}
        .modal-header{position:sticky;top:0;background:var(--bg2);padding:20px 24px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;z-index:10;}
        .modal-close{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,0.05);color:#fff;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;}
        .modal-body{padding:24px;}
        .detail-img{width:100%;height:250px;object-fit:cover;border-radius:var(--radius-sm);margin-bottom:20px;background:var(--bg3);}
        .gallery-container{position:relative;margin-bottom:20px;border-radius:var(--radius-sm);overflow:hidden;background:var(--bg3);}
        .gallery-img{width:100%;height:280px;object-fit:cover;display:block;}
        .gallery-controls{position:absolute;top:50%;transform:translateY(-50%);width:100%;display:flex;justify-content:space-between;padding:0 10px;pointer-events:none;}
        .gallery-btn{pointer-events:all;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:1.5rem;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition);}
        .gallery-btn:hover{background:rgba(168,85,247,0.6);border-color:var(--accent);}
        .gallery-dots{display:flex;justify-content:center;gap:8px;margin-top:10px;}
        .gallery-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);cursor:pointer;transition:var(--transition);}
        .gallery-dot.active{background:var(--accent);box-shadow:0 0 8px var(--accent-glow);}
        .detail-meta-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(120px, 1fr));gap:12px;margin-bottom:20px;}
        .detail-meta-item{background:var(--bg3);padding:14px;border-radius:var(--radius-xs);text-align:center;}
        .meta-val{font-weight:700;color:#fff;}
        .meta-lbl{font-size:0.7rem;color:var(--text3);text-transform:uppercase;}
        .detail-desc{color:var(--text2);line-height:1.7;margin-bottom:20px;}
        .footer{background:rgba(10,10,15,0.8);border-top:1px solid rgba(255,255,255,0.05);padding:30px 0 20px;margin-top:40px;position:relative;z-index:1;}
        .footer-content{max-width:1300px;margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
        .footer-text{color:var(--text3);font-size:0.85rem;}
        .footer-links{display:flex;gap:20px;}
        .footer-links a{color:var(--text2);text-decoration:none;font-size:0.85rem;transition:var(--transition);}
        .footer-links a:hover{color:var(--accent);}
        @media(max-width:768px){.post-grid{grid-template-columns:1fr;}.header-inner{gap:12px;}.search-wrap{order:3;max-width:100%;flex:100%;}.footer-content{flex-direction:column;text-align:center;}}
    </style>
</head>
<body>
    <header class="header" id="header">
        <div class="container">
            <div class="header-inner">
                <a href="#" class="logo" onclick="resetFilters()">
                    <div class="logo-icon">⚡</div>
                    <div class="logo-text"><span>Destaseo</span> Mods</div>
                </a>
                <div class="search-wrap">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="searchInput" placeholder="Cari aplikasi mod..." oninput="renderPosts()">
                </div>
                <!-- Tombol login admin (hanya muncul jika belum login) -->
                <button class="btn btn-outline btn-icon" id="loginButton" onclick="loginAdmin()" title="Login Admin" style="display:none;">🔑</button>
                <!-- Tombol admin setelah login -->
                <div id="adminButtons" style="display:none; gap:8px; align-items:center;">
                    <a href="add-mod.html" class="btn btn-primary btn-sm">＋ Tambah Mod</a>
                    <button class="btn btn-outline btn-sm" onclick="logoutAdmin()">🚪 Logout</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="stats-bar">
            <div class="stat-card"><div class="stat-icon purple">📦</div><div class="stat-info"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Total Mod</div></div></div>
            <div class="stat-card"><div class="stat-icon blue">⬇️</div><div class="stat-info"><div class="stat-value" id="statDownloads">0</div><div class="stat-label">Total Download</div></div></div>
            <div class="stat-card"><div class="stat-icon green">⭐</div><div class="stat-info"><div class="stat-value" id="statAvgRating">0</div><div class="stat-label">Rata-rata Rating</div></div></div>
            <div class="stat-card"><div class="stat-icon gold">🏷️</div><div class="stat-info"><div class="stat-value" id="statCategories">0</div><div class="stat-label">Kategori</div></div></div>
        </div>

        <div class="filter-section">
            <span class="filter-label">Filter:</span>
            <button class="chip active" data-category="all" onclick="setCategory('all', this)">🌟 Semua</button>
            <button class="chip" data-category="tool" onclick="setCategory('tool', this)">🔧 Tools</button>
            <button class="chip" data-category="social" onclick="setCategory('social', this)">💬 Sosial</button>
            <button class="chip" data-category="multimedia" onclick="setCategory('multimedia', this)">🎬 Multimedia</button>
            <button class="chip" data-category="productivity" onclick="setCategory('productivity', this)">📋 Produktivitas</button>
            <button class="chip" data-category="other" onclick="setCategory('other', this)">📎 Lainnya</button>
        </div>

        <div class="post-grid" id="postGrid"></div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-text">© 2026 Destaseo Mods. Katalog aplikasi mod terpercaya.</div>
            <div class="footer-links">
                <a href="tentang.html">Tentang</a>
                <a href="kebijakan.html">Kebijakan</a>
                <a href="kontak.html">Kontak</a>
            </div>
        </div>
    </footer>

    <div class="modal-overlay" id="detailModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="detailModalTitle">Detail Mod</h2>
                <button class="modal-close" onclick="closeDetailModal()">✕</button>
            </div>
            <div class="modal-body" id="detailModalBody"></div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'modhub_data';
        const ADMIN_PASSWORD = 'admin123';

        const defaultModData = [
            { name:"WhatsApp Aero Mod", category:"social", version:"v10.20", developer:"AeroDev", rating:4.8,
              description:"WhatsApp dengan tema kustom, anti-banned, privasi lengkap.",
              fullDescription:"Modifikasi WhatsApp populer dengan ribuan tema, font kustom, kemampuan menyembunyikan centang biru, status online, dan fitur privasi canggih.",
              downloadLink:"https://example.com/wa-aero", downloadCount:12500,
              tags:["premium","anti-banned","tema","privasi"],
              image:"https://picsum.photos/seed/whatsapp/400/200",
              images:["https://picsum.photos/seed/wa1/600/400","https://picsum.photos/seed/wa2/600/400"],
              icon:"" },
            { name:"Spotify Premium Mod", category:"multimedia", version:"v8.9.80", developer:"SpotifyMods", rating:4.6,
              description:"Spotify Premium gratis, tanpa iklan, download offline.",
              fullDescription:"Streaming jutaan lagu tanpa iklan, download offline kualitas tinggi, unlimited skip.",
              downloadLink:"https://example.com/spotify-premium", downloadCount:24300,
              tags:["premium","no-ads","offline","unlocked"],
              image:"https://picsum.photos/seed/spotify/400/200",
              images:["https://picsum.photos/seed/sp1/600/400"],
              icon:"🎵" }
        ];

        let posts = [];
        let currentCategory = 'all';

        function loadPosts() {
            const stored = localStorage.getItem(STORAGE_KEY);
            posts = stored ? JSON.parse(stored) : defaultModData.map((p,i) => ({...p, id:'mod_'+i+'_'+Date.now()}));
            posts.forEach((p,i) => p.index = i+1);
        }

        function savePosts() {
            posts.forEach((p,i) => p.index = i+1);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
        }

        function getFilteredPosts() {
            let filtered = [...posts];
            if(currentCategory !== 'all') filtered = filtered.filter(p => p.category === currentCategory);
            const query = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
            if(query) filtered = filtered.filter(p => [p.name,p.description,p.fullDescription||'',p.developer,p.version,...(p.tags||[])].join(' ').toLowerCase().includes(query));
            return filtered;
        }

        function getStats() {
            const all = posts;
            const totalDownloads = all.reduce((s,p)=> s+(p.downloadCount||0),0);
            const avgRating = all.length ? (all.reduce((s,p)=>s+(p.rating||0),0)/all.length).toFixed(1) : 0;
            const categories = new Set(all.map(p=>p.category));
            return { total:all.length, totalDownloads, avgRating, categoriesCount:categories.size };
        }

        function renderPosts() {
            const grid = document.getElementById('postGrid');
            const filtered = getFilteredPosts();
            if(!filtered.length) {
                grid.innerHTML = `<div class="empty-state"><div style="font-size:4rem;opacity:0.3;">📭</div><h3>Tidak ditemukan</h3><p>Coba ubah filter atau kata kunci.</p></div>`;
            } else {
                grid.innerHTML = filtered.map(p => {
                    const bgStyle = p.image ? `background-image:url('${escapeHTML(p.image)}'); background-size:cover;` : '';
                    const iconContent = p.icon 
                        ? (p.icon.match(/^https?:\/\//) ? `<img src="${escapeHTML(p.icon)}" style="width:60px;height:60px;object-fit:contain;" alt="icon">` : `<span class="banner-icon" style="font-size:3rem;">${escapeHTML(p.icon)}</span>`)
                        : (!p.image ? `<span class="banner-icon">${getCategoryEmoji(p.category)}</span>` : '');
                    const tagsHtml = (p.tags||[]).slice(0,3).map(t=>
                        `<span class="tag" onclick="event.stopPropagation(); searchByTag('${escapeHTML(t)}')">#${escapeHTML(t)}</span>`
                    ).join('');
                    return `<div class="post-card" onclick="openDetail('${p.id}')">
                        <div class="card-banner" style="${bgStyle}">
                            ${iconContent}
                            <span class="index-badge">#${String(p.index).padStart(3,'0')}</span>
                            <span class="category-badge">${getCategoryLabel(p.category)}</span>
                        </div>
                        <div class="card-body">
                            <h3 class="card-title">${escapeHTML(p.name)}</h3>
                            <p class="card-desc">${escapeHTML(p.description || '')}</p>
                            <div class="card-meta">
                                <span>⭐ ${(p.rating||0).toFixed(1)}</span>
                                <span class="clickable-dev" onclick="event.stopPropagation(); searchDeveloper('${escapeHTML(p.developer||'')}')">👤 ${escapeHTML(p.developer||'')}</span>
                                <span>⬇️ ${formatNumber(p.downloadCount||0)}</span>
                            </div>
                        </div>
                        <div class="card-footer"><span class="tag version-tag">${escapeHTML(p.version)}</span>${tagsHtml}</div>
                    </div>`;
                }).join('');
            }
            updateStats();
        }

        function updateStats() {
            const s = getStats();
            document.getElementById('statTotal').textContent = s.total;
            document.getElementById('statDownloads').textContent = formatNumber(s.totalDownloads);
            document.getElementById('statAvgRating').textContent = s.avgRating;
            document.getElementById('statCategories').textContent = s.categoriesCount;
        }

        function searchByTag(tag) {
            if (!tag) return;
            document.getElementById('searchInput').value = tag;
            currentCategory = 'all';
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            const allChip = document.querySelector('.chip[data-category="all"]');
            if (allChip) allChip.classList.add('active');
            renderPosts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function searchDeveloper(devName) {
            if (!devName) return;
            document.getElementById('searchInput').value = devName;
            currentCategory = 'all';
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            const allChip = document.querySelector('.chip[data-category="all"]');
            if (allChip) allChip.classList.add('active');
            renderPosts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openDetail(id) {
            const post = posts.find(p=>p.id===id); if(!post) return;
            document.getElementById('detailModalTitle').textContent = `#${String(post.index).padStart(3,'0')} - ${post.name}`;
            
            let imageSection = '';
            const images = post.images && post.images.length ? post.images : (post.image ? [post.image] : []);
            if(images.length > 1) {
                const imageItems = images.map((img, idx) => 
                    `<img src="${escapeHTML(img)}" class="gallery-img" style="display:${idx===0?'block':'none'};" onerror="this.style.display='none'" alt="gambar ${idx+1}">`
                ).join('');
                const dots = images.map((_, idx) => 
                    `<span class="gallery-dot ${idx===0?'active':''}" onclick="changeGalleryImage(${idx})"></span>`
                ).join('');
                imageSection = `
                <div class="gallery-container" id="galleryContainer">
                    ${imageItems}
                    <div class="gallery-controls">
                        <button class="gallery-btn" onclick="prevGalleryImage()">‹</button>
                        <button class="gallery-btn" onclick="nextGalleryImage()">›</button>
                    </div>
                </div>
                <div class="gallery-dots">${dots}</div>`;
            } else if(images.length === 1) {
                imageSection = `<img src="${escapeHTML(images[0])}" class="detail-img" onerror="this.style.display='none'" alt="${escapeHTML(post.name)}">`;
            } else {
                imageSection = `<div class="detail-img" style="display:flex;align-items:center;justify-content:center;font-size:5rem;color:rgba(255,255,255,0.1);">${getCategoryEmoji(post.category)}</div>`;
            }

            document.getElementById('detailModalBody').innerHTML = `
                ${imageSection}
                <div class="detail-meta-grid">
                    <div class="detail-meta-item"><div class="meta-val">⭐ ${(post.rating||0).toFixed(1)}</div><div class="meta-lbl">Rating</div></div>
                    <div class="detail-meta-item"><div class="meta-val">${escapeHTML(post.version)}</div><div class="meta-lbl">Versi</div></div>
                    <div class="detail-meta-item"><div class="meta-val clickable-dev" onclick="closeDetailModal(); searchDeveloper('${escapeHTML(post.developer||'')}')">👤 ${escapeHTML(post.developer||'')}</div><div class="meta-lbl">Developer</div></div>
                    <div class="detail-meta-item"><div class="meta-val">⬇️ ${formatNumber(post.downloadCount)}</div><div class="meta-lbl">Download</div></div>
                    <div class="detail-meta-item"><div class="meta-val">${getCategoryLabel(post.category)}</div><div class="meta-lbl">Kategori</div></div>
                    <div class="detail-meta-item"><div class="meta-val">#${String(post.index).padStart(3,'0')}</div><div class="meta-lbl">Indeks</div></div>
                </div>
                <p class="detail-desc"><strong>📝 Deskripsi Lengkap</strong><br>${escapeHTML(post.fullDescription || post.description)}</p>
                ${(post.tags||[]).length ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;">${post.tags.map(t=>`<span class="tag" onclick="closeDetailModal(); searchByTag('${escapeHTML(t)}')">#${escapeHTML(t)}</span>`).join('')}</div>` : ''}
                ${post.downloadLink ? `<a href="${escapeHTML(post.downloadLink)}" target="_blank" class="btn btn-primary" style="display:inline-flex;margin-top:8px;">⬇️ Download Mod</a>` : '<span style="opacity:0.6;">🔗 Link tidak tersedia</span>'}
            `;

            window._currentGalleryImages = images;
            window._currentGalleryIdx = 0;

            document.getElementById('detailModalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function changeGalleryImage(idx) {
            if(!window._currentGalleryImages) return;
            const images = window._currentGalleryImages;
            if(idx < 0 || idx >= images.length) return;
            window._currentGalleryIdx = idx;
            document.querySelectorAll('#detailModalBody .gallery-img').forEach((img, i) => {
                img.style.display = i === idx ? 'block' : 'none';
            });
            document.querySelectorAll('#detailModalBody .gallery-dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === idx);
            });
        }

        function prevGalleryImage() {
            if(!window._currentGalleryImages) return;
            const len = window._currentGalleryImages.length;
            const newIdx = (window._currentGalleryIdx - 1 + len) % len;
            changeGalleryImage(newIdx);
        }

        function nextGalleryImage() {
            if(!window._currentGalleryImages) return;
            const len = window._currentGalleryImages.length;
            const newIdx = (window._currentGalleryIdx + 1) % len;
            changeGalleryImage(newIdx);
        }

        function closeDetailModal() {
            document.getElementById('detailModalOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
            if(btn) btn.classList.add('active');
            renderPosts();
        }

        function resetFilters() {
            currentCategory = 'all';
            document.getElementById('searchInput').value = '';
            document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
            document.querySelector('.chip[data-category="all"]').classList.add('active');
            renderPosts();
        }

        // ========== ADMIN LOGIN / UI ==========
        function loginAdmin() {
            const password = prompt('Masukkan password admin:');
            if (password === ADMIN_PASSWORD) {
                sessionStorage.setItem('admin', 'true');
                checkAdminUI();
                alert('✅ Login berhasil. Anda sekarang admin.');
            } else if (password !== null) {
                alert('❌ Password salah!');
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('admin');
            checkAdminUI();
            alert('Logout berhasil.');
        }

        function checkAdminUI() {
            const isAdmin = sessionStorage.getItem('admin') === 'true';
            document.getElementById('loginButton').style.display = isAdmin ? 'none' : 'inline-flex';
            document.getElementById('adminButtons').style.display = isAdmin ? 'flex' : 'none';
        }

        // ========== HELPERS ==========
        function getCategoryEmoji(cat){ const m={tool:'🔧', social:'💬', multimedia:'🎬', productivity:'📋', other:'📎'}; return m[cat]||'📱'; }
        function getCategoryLabel(cat){ const m={tool:'Tools', social:'Sosial', multimedia:'Multimedia', productivity:'Produktivitas', other:'Lainnya'}; return m[cat]||'Lainnya'; }
        function formatNumber(n){ if(n>=1e6) return (n/1e6).toFixed(1)+'M'; if(n>=1e3) return (n/1e3).toFixed(1)+'K'; return n.toString(); }
        function escapeHTML(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

        // ========== EVENTS ==========
        document.getElementById('detailModalOverlay').addEventListener('click', e => { if(e.target===e.currentTarget) closeDetailModal(); });
        document.addEventListener('keydown', e => { if(e.key==='Escape') closeDetailModal(); });
        window.addEventListener('scroll', () => document.getElementById('header').classList.toggle('scrolled', window.scrollY>20));

        // ========== INIT ==========
        loadPosts();
        savePosts();
        renderPosts();
        checkAdminUI();
    </script>
</body>
</html>
